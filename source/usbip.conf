# /etc/usbip/usbip.conf  —  must be root-owned, 640/600

# ========== General ==========
LOG_FACILITY=daemon.info
NOTIFY_ENABLED=1

# ========== SERVER section ==========
SRV_INTERVAL=3
#SRV_EXPORT_ONLY=("3-2" "3-3")
SRV_EXPORT_ONLY=()
SRV_UNBIND_ON_STOP=1
SRV_USBIPD_OPTS="-4"

# ========== CLIENT section ==========
CLI_INTERVAL=5
#CLI_SERVERS=("192.168.0.100")
# Tunnel mode: use 127.0.0.1 (local forwarded port);
# Direct mode: use the server's real IP.
CLI_SERVERS=("127.0.0.1")
CLI_TCP_PORT=3240
# CLI_DEVICES=("3-2" "3-3")
CLI_DEVICES=()
CLI_DETACH_ON_REMOVE=1
CLI_DETACH_ON_STOP=1
CLI_LIST_TIMEOUT=5
